<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <title>Alien Invasion | Ben Librojo</title>
  <style>:root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; color: #e5e6e9; background: #0c0d10; }
* { box-sizing: border-box; letter-spacing: 0; }
body { margin: 0; min-width: 280px; min-height: 100svh; display: grid; align-items: center; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; color: inherit; cursor: pointer; border: 1px solid #383b42; background: #191b20; border-radius: 4px; }
button:hover { background: #282b32; border-color: #727782; }
button:focus-visible, input:focus-visible { outline: 2px solid #8edbd2; outline-offset: 3px; }
button:disabled { cursor: default; opacity: .35; }
button svg { width: 20px; height: 20px; flex-shrink: 0; pointer-events: none; }
button:active, button.held { background: #383d44; border-color: #c4cbd0; }
[hidden] { display: none !important; }
#app { width: min(824px, 100%); margin: 0 auto; padding: 16px 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; margin-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { object-fit: contain; flex-shrink: 0; }
h1 { margin: 0 0 7px; font-size: 24px; line-height: 1.1; font-weight: 700; }
.brand p { margin: 0; font-size: 12px; color: #a2a6ae; }
.brand p span { color: #535963; padding: 0 6px; }
nav { display: flex; gap: 6px; flex-shrink: 0; }
.icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
nav .icon { border-color: transparent; background: transparent; color: #bdc1c8; }
nav .icon:hover { background: #22252b; }
#stage { position: relative; width: 100%; aspect-ratio: 400 / 350; background: black; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; image-rendering: pixelated; }
#load-state { position: absolute; inset: 0; display: grid; place-items: center; background: #000; color: #d8d9dd; font-size: 14px; }
#curtain { position: absolute; inset: 66% 0 auto; display: flex; justify-content: center; pointer-events: none; }
.command { height: 40px; padding: 0 20px; display: flex; align-items: center; gap: 10px; background: #b53137; border-color: #de555b; color: white; font-weight: 700; font-size: 13px; pointer-events: auto; }
.command:hover { background: #c64046; border-color: #f6757a; }
.command svg { width: 16px; height: 16px; }
.console { border-top: 1px solid #303238; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0 10px; }
.controls { display: flex; gap: 8px; }
.control { position: relative; width: 64px; height: 48px; touch-action: none; user-select: none; -webkit-user-select: none; }
.control[data-control="5"] { color: #83c4ed; }
.control[data-control="6"] { color: #b6bcc6; }
.control[data-control="4"] { color: #f1d473; }
.control[data-control="8"] { color: #a8d7d2; }
.control[data-control="7"] { color: #e3aca6; }
.weapons .control:not(.fire) { padding-right: 12px; }
.ammo { position: absolute; right: 7px; bottom: 7px; font-size: 10px; font-variant-numeric: tabular-nums; color: #c6c9d0; pointer-events: none; }
.fire { background: #183124; border-color: #345b42; color: #8ee3a4; width: 88px; }
.fire:hover, .fire.held { background: #255135; border-color: #78bb8c; }
.control.armed { border-color: #ef9f55; color: #ffc56c; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 11px; color: #9b9fa8; min-height: 30px; }
#status { min-width: 100px; }
#best { text-align: right; font-variant-numeric: tabular-nums; min-width: 100px; }
.volume { display: inline-flex; align-items: center; gap: 8px; }
.volume svg { width: 15px; height: 15px; }
input[type="range"] { width: 72px; height: 16px; accent-color: #aab5bd; cursor: pointer; }
@media (min-width: 640px) {
  #app { width: min(824px, calc((100svh - 220px) * 400 / 350 + 24px)); min-width: 0; }
  .control { width: 52px; } .fire { width: 64px; }
}
@media (max-width: 620px) {
  body { align-items: start; }
  #app { padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  header { min-height: 60px; margin-bottom: 8px; gap: 8px; }
  #stage { width: min(100%, calc((100svh - 256px) * 400 / 350)); margin-inline: auto; }
  .brand { gap: 10px; } .brand img { width: 48px; height: 40px; }
  h1 { font-size: 18px; margin-bottom: 5px; } .brand p { font-size: 10px; }
  nav { gap: 0; } nav .icon { width: 32px; height: 36px; } nav .icon svg { width: 17px; height: 17px; }
  .console { gap: 10px; padding-top: 12px; }
  .controls { flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .control, .fire { width: 100%; height: 52px; }
  .control svg { width: 18px; height: 18px; }
  .weapons .control:not(.fire) { padding-right: 0; padding-bottom: 8px; }
  .ammo { bottom: 3px; right: 5px; }
  footer { gap: 8px; } #status, #best { min-width: 78px; }
}
@media (max-width: 370px) {
  .brand img { display: none; } h1 { font-size: 17px; }
  .console { gap: 8px; } .controls { gap: 3px; }
  #app { padding-left: 8px; padding-right: 8px; }
  .volume input { width: 52px; }
}
@media (max-height: 620px) and (orientation: landscape) {
  #app { width: 100%; min-width: 0; max-width: 1100px; display: grid; grid-template-columns: minmax(90px, 1fr) min(calc((100svh - 32px) * 400 / 350), calc(100vw - 236px)) minmax(94px, 1fr); gap: 12px; align-items: center; }
  header { flex-direction: column; justify-content: center; } .brand { flex-direction: column; text-align: center; } .brand img { width: 75px; height: 56px; }
  h1 { font-size: 18px; } nav { flex-wrap: wrap; justify-content: center; max-width: 90px; }
  #stage { grid-column: 2; grid-row: 1 / 3; width: 100%; }
  .console { flex-direction: column; border: 0; padding: 0; gap: 12px; }
  .controls { display: grid; grid-template-columns: repeat(2, 44px); gap: 6px; flex: none; }
  .control, .fire { width: 44px; height: 44px; }
  footer { display: none; }
}
</style>
</head>

  <main id="app">
    <header>
      <div class="brand"><img id="title-art" width="75" height="56" alt=""><div><h1>Alien Invasion</h1><p>Ben Librojo <span aria-hidden="true">/</span> 1999</p></div></div>

    <div class="console">
      <div class="controls" aria-label="Flight controls">
        <button class="control icon" data-control="0" aria-label="Move left" title="Move left (Left arrow / J)"><i data-lucide="arrow-left"></i></button>

        <button class="control icon" data-control="8" aria-label="Heat seeker" title="Heat seeker (W)"><i data-lucide="rocket"></i><span class="ammo" id="seeker-count">5</span></button>
        <button class="control icon" data-control="7" aria-label="Cluster bomb" title="Cluster bomb / Detonate (D)"><i data-lucide="orbit"></i><span class="ammo" id="bomb-count">5</span></button>
        <button class="control icon fire" data-control="2" aria-label="Fire" title="Fire (Space)"><i data-lucide="crosshair"></i></button>

    <footer><span id="status" role="status" aria-live="polite">Ready</span><label class="volume"><i data-lucide="volume-1" aria-hidden="true"></i><input id="volume" type="range" min="0" max="100" value="50" aria-label="Volume" title="Volume"></label><span id="best">Best 0</span></footer>
